name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest
      - run: python scripts/check_versions.py
      - run: python scripts/collect_licenses.py check
      - run: python scripts/build_release.py
      - name: Publicar artefactos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            LICENSE
            NOTICE
            THIRD-PARTY-NOTICES.md
            TRADEMARKS.md
          generate_release_notes: false
          body_path: CHANGELOG.md
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sigma:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sigma:latest
