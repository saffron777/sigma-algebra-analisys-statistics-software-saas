name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest
        env:
          SIGMA_TESTING: "1"

  legal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check_versions.py
      - run: python scripts/collect_licenses.py check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t sigma:ci .
      - run: |
          docker run -d --name sigma-ci -p 5001:5000 sigma:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5001/health
          curl -fsS http://127.0.0.1:5001/licencia | grep -q "GNU AFFERO GENERAL PUBLIC LICENSE"
      - if: always()
        run: docker logs sigma-ci || true
      - if: always()
        run: docker rm -f sigma-ci || true
