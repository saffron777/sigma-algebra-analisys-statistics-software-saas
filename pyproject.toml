[project]
name = "sigma"
version = "0.1.0"
description = "Sigma - plataforma web de estadística (Flask + Tailwind)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: llama a servicios reales (necesita claves; se omite por defecto: pytest -m live)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["instance", "sample_data", "node_modules", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# the catalogue is declarative: long descriptions, help texts and the strings of generated Python read better unbroken
"sigma/domain/analysis/*.py" = ["E501"]
"sigma/infrastructure/kernel/helpers.py" = ["E501"]
