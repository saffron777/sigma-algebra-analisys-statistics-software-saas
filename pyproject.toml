[project]
name = "sigma-algebra-analisys-statistics-software-saas"
version = "1.0.0"
description = "Sigma Algebra Analisys Statistics Software (SAAS) - plataforma web de estadística (Flask + Tailwind)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Frank Miranda" }]
keywords = ["statistics", "data-analysis", "flask", "python", "self-hosted", "agpl", "spss", "minitab"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
[project.urls]
Homepage = "https://github.com/saffron777/sigma-algebra-analisys-statistics-software-saas"
Source = "https://github.com/saffron777/sigma-algebra-analisys-statistics-software-saas"
Issues = "https://github.com/saffron777/sigma-algebra-analisys-statistics-software-saas/issues"
Changelog = "https://github.com/saffron777/sigma-algebra-analisys-statistics-software-saas/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: llama a servicios reales (necesita claves; se omite por defecto: pytest -m live)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["instance", "sample_data", "node_modules", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: the catalogue, generated Python and documentation intentionally use long unbroken strings.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
