{# Global "save result" dialog, driven by Alpine.store('save') #}
<div x-data x-show="$store.save.open" x-cloak class="fixed inset-0 z-50 grid place-items-center p-4" role="dialog" aria-modal="true" aria-labelledby="save-title"
     @keydown.escape.window="$store.save.close()">
  <div class="absolute inset-0 bg-slate-900/60" @click="$store.save.close()"></div>
  <form class="card relative w-full max-w-lg shadow-xl" @submit.prevent="$store.save.submit()">
    <div class="card-header"><h2 id="save-title" class="card-title">Guardar resultado</h2></div>
    <div class="card-body space-y-4">
      <div>
        <label class="label" for="save-title-input">Título</label>
        <input id="save-title-input" class="input" type="text" maxlength="200" required x-model="$store.save.title" x-ref="title">
      </div>
      <div>
        <label class="label" for="save-notes">Notas (opcional)</label>
        <textarea id="save-notes" class="input" rows="4" maxlength="5000" x-model="$store.save.notes" placeholder="Observaciones, hipótesis, decisiones…"></textarea>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Se guarda en la base SQLite local de Sigma Algebra, junto con los parámetros, las tablas y los gráficos.
      </p>
      <p class="alert alert-danger" x-show="$store.save.error" x-text="$store.save.error"></p>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3 dark:border-slate-800">
      <button type="button" class="btn btn-ghost" @click="$store.save.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary" :disabled="$store.save.saving">
        <span x-text="$store.save.saving ? 'Guardando…' : 'Guardar'"></span>
      </button>
    </div>
  </form>
</div>
