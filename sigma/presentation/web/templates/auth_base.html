<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="color-scheme" content="light dark">
  <title>{{ page_title }} · Sigma</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="icon" type="image/x-icon" sizes="any" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block scripts %}{% endblock %}
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
</head>
<body class="min-h-full bg-gradient-to-br from-slate-100 to-brand-50 dark:from-slate-950 dark:to-slate-900">
  <main class="grid min-h-screen place-items-center px-4 py-10">
    <div class="w-full max-w-md space-y-6">
      <div class="flex flex-col items-center gap-3 text-center">
        <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="" width="72" height="72" class="size-[4.5rem] drop-shadow-md">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sigma</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400">Plataforma de análisis estadístico</p>
        </div>
      </div>
      {% block content %}{% endblock %}
      <p class="text-center text-xs text-slate-400">Sigma v{{ sigma_version }}</p>
    </div>
  </main>
</body>
</html>
