{% extends "base.html" %}
{% set page_title = "Error " ~ status %}
{% block content %}
<div class="card mx-auto mt-10 max-w-lg text-center">
  <div class="card-body space-y-3 py-10">
    <p class="text-5xl font-bold text-brand-600">{{ status }}</p>
    <p class="text-slate-600 dark:text-slate-300">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('pages.page_home') }}">Volver al inicio</a>
  </div>
</div>
{% endblock %}
