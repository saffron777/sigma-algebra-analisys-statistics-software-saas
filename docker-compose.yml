services:
  sigma:
    build: .
    image: ghcr.io/saffron777/sigma:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SIGMA_HOST: 0.0.0.0
      SIGMA_PORT: "5000"
      SIGMA_INSTANCE_DIR: /app/instance
      SIGMA_SOURCE_URL: ${SIGMA_SOURCE_URL:-https://github.com/saffron777/Sigma}
      SIGMA_SECRET_KEY: ${SIGMA_SECRET_KEY:-}
      SIGMA_SECURE_COOKIES: ${SIGMA_SECURE_COOKIES:-}
      SIGMA_DATABASE_URL: ${SIGMA_DATABASE_URL:-}
    volumes:
      - sigma_instance:/app/instance
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sigma_instance:
